; --------------------------------------------------------------------------
; MESH_SLIM: the same firmware carrying a second wire format.
;
;   WITH_MESH_SLIM=1     compile both protocols. `proto set slim` switches at
;                        runtime and persists. This is the RECOVERABLE build:
;                        a slim unit and a stock unit are mutually deaf, so a
;                        node that can be switched over the air can be rescued
;                        over the air rather than walked to.
;   MESH_SLIM_ONLY=1     slim only. active() folds to a constant, so the switch
;                        costs nothing - but recovery needs a cable.
;   MESH_SLIM_DEFAULT=1  boot into slim instead of MeshCore. Leave this off
;                        unless the whole team has been reflashed: a unit that
;                        boots onto the wrong protocol is inaudible, and it
;                        cannot be told so.
;
; Without WITH_MESH_SLIM not one line of slim code is compiled, and the build
; is byte-identical to upstream.
;
; Every slim environment carries the SLIM_ prefix so it sorts together, is
; unmistakable in a build log, and never collides with an upstream env name
; when this fork is rebased. Stock envs are untouched and still build normally.
; Identity comes from these flags, not from saved settings: a field trial needs
; a radio that is correct the moment it powers on, and RAM-only settings are
; lost by the first flat battery. Flashing each unit with its own number is how
; the briefing sheet already works - unit 7 is MTRK07.
;
;   MESH_SLIM_UNIT       1..15, the briefing number. MUST DIFFER PER UNIT.
;   MESH_SLIM_FORWARDS   1 on repeaters and the base, 0 on handhelds
;   MESH_SLIM_BURST      identical copies per transmission, 1..4
;   MESH_SLIM_KEY        32 hex chars, the operation key - SAME ON EVERY UNIT
;   MESH_SLIM_DEFAULT    1 to boot into slim rather than MeshCore
;
; THE KEY BELOW IS A TEST KEY AND IS IN A GIT REPOSITORY. Change it before any
; deployment that matters; a shared key is the only thing standing between this
; network and anyone injecting false positions into a live search.
[slim_common]
build_flags =
  -D WITH_MESH_SLIM=1
  -D MESH_SLIM_DEFAULT=1
  -D MESH_SLIM_BURST=3
  -D MESH_SLIM_KEY='"000102030405060708090a0b0c0d0e0f"'

; ---- tracker: handheld, does NOT repeat --------------------------------
; Ten units that all repeat is N-squared transmissions. Handhelds stay quiet
; and the designated repeaters carry the traffic.
;
; WITH_TRACKER_MODE: the unit can report its own GPS position on a timer and
; sleep the radio and GPS in between, with no phone attached - on either
; protocol. Off until told: custom variable `tracker:300` from a phone, or
; "!T300" from the base (the Pi's Devices table does this). `tracker:0` / "!T0"
; puts it back to an ordinary node. See examples/companion_radio/TrackerMode.h.
;   TRACKER_LISTEN_S       seconds listening after each report (default 10)
;   TRACKER_FIX_TIMEOUT_S  seconds to look for a fix before skipping (default 90)
[env:SLIM_RAK_4631_tracker]
extends = rak4631
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags =
  ${rak4631.build_flags}
  ${slim_common.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  ; Who this handheld is - [slim] in the root platformio.ini. The address
  ; follows from it (MTRK01 is unit 1); see SlimUnit.h. A unit the base
  ; names over the air instead takes that name and derives it again at
  ; runtime, so this is only what it comes up as out of the box.
  -D ADVERT_NAME='"${slim.callsign}"'
  ; ...and this env only builds handhelds, so the build refuses a callsign
  ; left over from flashing a repeater. See SlimUnit.h.
  -D MESH_SLIM_EXPECT_TRACKER=1
  -D MESH_SLIM_FORWARDS=0
  -D WITH_TRACKER_MODE=1
build_src_filter = ${rak4631.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<helpers/slim/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${rak4631.lib_deps}
  densaugeo/base64 @ ~1.4.0

; ---- tracker that boots MeshCore ---------------------------------------
; THE EXCEPTION. Every other slim env now boots MESH_SLIM; this one
; exists precisely to boot MeshCore, which is what its name says, so it
; keeps doing that - for joining a network still on MeshCore, or for
; recovering a unit. For a base that should come up on slim without
; being told, flash SLIM_RAK_4631_tracker: MSHCMD gets unit 15 and
; forwarding from its own name (loadSlimUnit), so the build flags do
; not have to say so.
;
; The same tracker, starting on MeshCore instead of slim. A companion has no
; runtime `proto` switch - only the repeater CLI does - so it stays on whichever
; protocol it boots into. This is the one for a network, and a base, still on
; MeshCore, and the only one that keeps a backlog: see TrackerMode.h.
[env:SLIM_RAK_4631_tracker_meshcore]
extends = env:SLIM_RAK_4631_tracker
build_flags =
  ${env:SLIM_RAK_4631_tracker.build_flags}
  -UMESH_SLIM_DEFAULT

; ---- base: companion at the incident base, DOES repeat -----------------
[env:SLIM_RAK_4631_base]
extends = env:SLIM_RAK_4631_tracker
build_flags =
  ${rak4631.build_flags}
  ${slim_common.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  ; Not from [slim]: there is one base on a channel and its name is fixed by
  ; the scheme, so it is the one callsign nobody should have to type. Unit
  ; 15 follows from MSHCMD through SlimUnit.h.
  -D ADVERT_NAME='"MSHCMD"'
  -D MESH_SLIM_FORWARDS=1

; ---- repeater: both protocols, one at a time; no companion, no BLE -----
; It listens on one sync word at a time, like any radio, and starts on the one
; it last saved - MeshCore until told otherwise, so a freshly flashed repeater
; can always be logged into and updated. `proto slim|meshcore` on its command
; line moves it (USB, or as admin over MeshCore); on slim, the base's
; "!S0 <name>" broadcast brings it back. No climbing the hill to recover it.
; Its slim unit is 15 - nn when it is named MRPTnn (MRPT01 is 14), counting
; down from the base while trackers count up; MESH_SLIM_UNIT for any other name.
[env:SLIM_RAK_4631_repeater]
extends = rak4631
build_flags =
  ${rak4631.build_flags}
  ${slim_common.build_flags}
  ; Boots MESH_SLIM, like everything else now.
  ;
  ; The trade this reverses: booting MeshCore meant a freshly flashed
  ; repeater could always be logged into with a stock client, which is
  ; worth something on a hilltop. It is now reachable on slim instead -
  ; from the base, which is on slim, or over USB. What it buys is that a
  ; repeater that reboots comes back carrying traffic rather than
  ; sitting on the wrong protocol waiting to be noticed.
  ; **The name is what sets the unit number.** loadSlimUnit() reads
  ; node_name and only acts on "MRPTnn" - MRPT01 becomes unit 14, counting
  ; down from the base at 15. Without it the name defaults to "repeater",
  ; the pattern does not match, and the unit silently stays on
  ; MESH_SLIM_UNIT below, where the base addresses it as nobody.
  ;
  ; Who this board is - set it in [slim] at the top of the root
  ; platformio.ini, one line, per board. The MESH_SLIM address is derived
  ; from it at compile time by src/helpers/slim/SlimUnit.h: MRPT01 is unit
  ; 14, counting down from the base at 15. There is no second number here
  ; to fall out of step with it, which is what used to happen.
  ;
  ; Only reaches a board with no saved prefs: CommonCLI::loadPrefs reads
  ; node_name back from flash and overwrites this. A board that has been
  ; configured before still needs `set name MRPTnn` on its command line -
  ; which is also the way to move a board from one callsign to another
  ; without erasing it.
  -D ADVERT_NAME='"${slim.callsign}"'
  ; ...and only repeaters, so a tracker's callsign fails the build rather
  ; than putting a repeater on a handheld's address. See SlimUnit.h.
  -D MESH_SLIM_EXPECT_REPEATER=1
  -D MESH_SLIM_FORWARDS=1
build_src_filter = ${rak4631.build_src_filter}
  +<helpers/slim/*.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${rak4631.lib_deps}