[WioTrackerL1]
extends = nrf52_base
board = seeed-wio-tracker-l1
board_build.ldscript = boards/nrf52840_s140_v7.ld
build_flags = ${nrf52_base.build_flags}
  ${sensor_base.build_flags}
  -I lib/nrf52/s140_nrf52_7.3.0_API/include
  -I lib/nrf52/s140_nrf52_7.3.0_API/include/nrf52
  -I variants/wio-tracker-l1
  -D WIO_TRACKER_L1
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D PIN_OLED_RESET=-1
  -D GPS_BAUD_RATE=9600
build_src_filter = ${nrf52_base.build_src_filter}
  +<WioTrackerL1Board.cpp>
  +<../variants/wio-tracker-l1>
  +<helpers/ui/SH1106Display.cpp>
  +<helpers/sensors>
lib_deps= ${nrf52_base.lib_deps}
  ${sensor_base.lib_deps}
  adafruit/Adafruit SH110X @ ^2.1.13
  adafruit/Adafruit GFX Library @ ^1.12.1

[env:WioTrackerL1_repeater]
extends = WioTrackerL1
build_src_filter = ${WioTrackerL1.build_src_filter}
  +<../examples/simple_repeater>
build_flags =
  ${WioTrackerL1.build_flags}
  -D ADVERT_NAME='"WioTrackerL1 Repeater"'
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D DISPLAY_CLASS=SH1106Display
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps = ${WioTrackerL1.lib_deps}
  adafruit/RTClib @ ^2.1.3

[env:WioTrackerL1_room_server]
extends = WioTrackerL1
build_src_filter = ${WioTrackerL1.build_src_filter}
  +<../examples/simple_room_server>
build_flags = ${WioTrackerL1.build_flags}
  -D ADVERT_NAME='"WioTrackerL1 Room"'
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
  -D DISPLAY_CLASS=SH1106Display
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps = ${WioTrackerL1.lib_deps}
  adafruit/RTClib @ ^2.1.3

[env:WioTrackerL1_companion_radio_usb]
extends = WioTrackerL1
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags = ${WioTrackerL1.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=SH1106Display
  -D UI_HAS_JOYSTICK=1
  -D OFFLINE_QUEUE_SIZE=256
  -D PIN_BUZZER=12
  -D QSPIFLASH=1
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${WioTrackerL1.build_src_filter}
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
  +<helpers/ui/SH1106Display.cpp>
  +<helpers/ui/buzzer.cpp>
lib_deps = ${WioTrackerL1.lib_deps}
  adafruit/RTClib @ ^2.1.3
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0

[env:WioTrackerL1_companion_radio_ble]
extends = WioTrackerL1
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags = ${WioTrackerL1.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
  -D DISPLAY_CLASS=SH1106Display
  -D UI_HAS_JOYSTICK=1
  -D PIN_BUZZER=12
  -D QSPIFLASH=1
  -D ADVERT_NAME='"@@MAC"'
  -D ENV_PIN_SDA=PIN_WIRE1_SDA
  -D ENV_PIN_SCL=PIN_WIRE1_SCL
  ; -D MESH_PACKET_LOGGING=1
  ; -D MESH_DEBUG=1
build_src_filter = ${WioTrackerL1.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/buzzer.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps = ${WioTrackerL1.lib_deps}
  adafruit/RTClib @ ^2.1.3
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0

; ---- MESH_SLIM + tracker mode on the Wio Tracker L1 Pro -------------------
; The BLE companion with both wire formats and tracker mode, driven from the
; joystick menu as well as from a phone or the base. A "Protocol" page switches
; MeshCore <-> MESH_SLIM and remembers it across reboots; a "Tracker" page
; turns tracker mode on, sets its interval and shows what it is doing.
;
; FIRST BOOT IS MESH_SLIM, and the Protocol page is a recovery path rather
; than a step in deployment: flash, name, and the unit is on the network the
; team is on. (This note used to say the opposite, and was four lines above
; the flag that contradicted it.)
;
; MESH_SLIM_UNIT is only the fallback for a name that carries no number:
; loadSlimUnit takes the unit from the callsign, so MTRK01 is unit 1 and
; MTRK02 is unit 2 from ONE image. Flash both L1s with this env and tell
; them apart with `set name`, not with a rebuild.
[env:SLIM_WioTrackerL1_companion_radio_ble]
extends = env:WioTrackerL1_companion_radio_ble
build_flags =
  ${env:WioTrackerL1_companion_radio_ble.build_flags}
  ${slim_common.build_flags}
  ; Boots MESH_SLIM. It used to boot MeshCore so a new unit could talk
  ; to a base that was still on it; the network is on slim now and the
  ; walk of 2026-09-25 proved it end to end, repeater included, so
  ; booting MeshCore only meant every freshly flashed unit had to be
  ; switched over by hand before it could say anything.
  ; Who this handheld is - [slim] in the root platformio.ini; the
  ; address follows from it through SlimUnit.h.
  -D ADVERT_NAME='"${slim.callsign}"'
  ; Handhelds only; see SlimUnit.h.
  -D MESH_SLIM_EXPECT_TRACKER=1
  -D MESH_SLIM_FORWARDS=0
  -D WITH_TRACKER_MODE=1

  ; Bluetooth off until the operator asks for it on the BLUETOOTH page,
  ; and their choice remembered. A tracker in a pack has no phone near it
  ; and spent the day advertising to nobody. See MyMesh::bleWanted.
  -D MESH_SLIM_BLE_OFF=1
build_src_filter = ${env:WioTrackerL1_companion_radio_ble.build_src_filter}
  +<helpers/slim/*.cpp>

[env:WioTrackerL1_kiss_modem]
extends = WioTrackerL1
build_src_filter = ${WioTrackerL1.build_src_filter}
  +<../examples/kiss_modem/>
