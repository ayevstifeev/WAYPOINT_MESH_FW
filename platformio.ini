; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs =
  variants/*/platformio.ini
  platformio.local.ini

; ==========================================================================
; THE TWO THINGS SET PER FLASH. Edit `callsign`, pick the env, upload.
; ==========================================================================
;
; **callsign** is who the board is. Everything follows from it: it is the
; name the node adverts, it IS its callsign on the map, and src/helpers/slim/
; SlimUnit.h derives the MESH_SLIM address from it at compile time -
; MTRK01 is unit 1, MRPT01 is 14 counting down from the base at 15. There is
; no second number to keep in step, and a name off the scheme fails the
; build rather than reaching a board that cannot say who it is.
;
;   trackers   MTRK01 .. MTRK15     handhelds
;   repeaters  MRPT01 .. MRPT14     MRPT01 is unit 14, MRPT02 is 13
;   base       MSHCMD               the incident base; the SLIM base env
;                                   pins this itself, so it is never edited
;
; Change it for each board as you flash. The env has to agree: the tracker
; envs refuse anything but MTRKnn and the repeater env anything but MRPTnn,
; so a callsign left over from the last board is a build error that names
; both halves rather than a handheld that comes up claiming to be a
; repeater. The base env needs nothing set - it pins MSHCMD itself.
;
; What no build can catch: **two boards flashed with the SAME callsign share
; one address**, which is invisible from the radio - both transmit, both are
; heard, and traffic for one is delivered to the other. The base reports it
; (Diagnostics -> unit_clashes); nothing on the board can.
;
; It only reaches a board whose prefs are EMPTY. CommonCLI::loadPrefs reads
; node_name and freq/bw/sf/cr back out of flash over the top of all of this,
; so a board that has been configured before keeps what it had: erase it, or
; use `set name` / `set radio` on a repeater's command line, or the app's
; Setup -> Radio card for a tracker, which has no command line at all. On
; 2026-10-01 two trackers took new firmware with 125 kHz compiled in and
; came up on 250 anyway, with nothing on the unit to say so.
;
; **The radio below must match on every node**, base included. A radio on
; other settings is not a weak node, it is an absent one. Moved off
; SF11/250k on 2026-10-01 for reach under bush, which is the whole reason
; MESH_SLIM exists: 125 kHz buys ~3 dB over 250 and SF12 another ~2.5, about
; +5.5 dB, most of a doubling of range in cover. Paid for entirely in
; airtime - a 22-byte position goes from 395 ms to 1.9 s - which is
; affordable only because the packets are small. The next step down is
; 62.5 kHz (+8.5 dB, 3.8 s a position) and needs slotting switched on and a
; longer interval; see slim_round.py.
[slim]
callsign = MTRK01
freq = 923.0
bw = 125.0
sf = 12
cr = 6

[arduino_base]
framework = arduino
monitor_speed = 115200
lib_deps =
  SPI
  Wire
  jgromes/RadioLib @ ^7.6.0
  rweather/Crypto @ ^0.4.0
  adafruit/RTClib @ ^2.1.3
  melopero/Melopero RV3028 @ ^1.1.0
  electroniccats/CayenneLPP @ 1.6.1
build_flags = -w -DNDEBUG -DRADIOLIB_STATIC_ONLY=1 -DRADIOLIB_GODMODE=1
  ; The radio, from [slim] at the top of this file. One place, because every
  ; node must match exactly and the base's MESH_* settings have to agree
  ; with it.
  ;
  ; Set in this shared base rather than in the SLIM_ envs: this is a fork
  ; whose every build belongs to one mesh, and a stock image flashed in a
  ; hurry should land on the right radio rather than on the EU defaults.
  ; A deliberate divergence from upstream, so expect this hunk to conflict
  ; on a merge and keep the fork's side.
  -D LORA_FREQ=${slim.freq}
  -D LORA_BW=${slim.bw}
  -D LORA_SF=${slim.sf}
  -D LORA_CR=${slim.cr}
  -D ENABLE_ADVERT_ON_BOOT=1
  -D ENABLE_PRIVATE_KEY_IMPORT=1   ; NOTE: comment these out for more secure firmware
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_AFSK=1
  -D RADIOLIB_EXCLUDE_AX25=1
  -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_MORSE=1
  -D RADIOLIB_EXCLUDE_APRS=1
  -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_RTTY=1
  -D RADIOLIB_EXCLUDE_SSTV=1
build_src_filter =
  +<*.cpp>
  +<helpers/*.cpp>
  +<helpers/radiolib/*.cpp>
  +<helpers/bridges/BridgeBase.cpp>
  +<helpers/ui/MomentaryButton.cpp>

; ----------------- ESP32 ---------------------

[esp32_base]
extends = arduino_base
platform = platformio/espressif32@6.11.0
monitor_filters = esp32_exception_decoder
extra_scripts = merge-bin.py
build_flags = ${arduino_base.build_flags}
  -D ESP32_PLATFORM
;  -D ESP32_CPU_FREQ=80          ; change it to your need
build_src_filter = ${arduino_base.build_src_filter}

[esp32_ota]
lib_deps =
  ESP32Async/ESPAsyncWebServer @ 3.10.3
  file://arch/esp32/AsyncElegantOTA

; esp32c6 uses arduino framework 3.x
; WARNING: experimental. May not work as stable as other platforms.
[esp32c6_base]
extends = esp32_base
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13-1/platform-espressif32.zip

; ----------------- NRF52 ---------------------

[nrf52_base]
extends = arduino_base
platform = nordicnrf52
platform_packages =
  ; use internal fork that includes patch to ble stack to prevent firmware lockup during rapid connect/disconnect
  ; https://github.com/meshcore-dev/MeshCore/pull/1177
  ; https://github.com/meshcore-dev/MeshCore/pull/1295
  ;framework-arduinoadafruitnrf52 @ https://github.com/meshcore-dev/Adafruit_nRF52_Arduino#d541301
  ;framework-arduinoadafruitnrf52 @ https://github.com/meshcore-dev/Adafruit_nRF52_Arduino/archive/d541301.zip
  ;framework-arduinoadafruitnrf52 @ https://github.com/meshcore-dev/Adafruit_nRF52_Arduino.git#master
  framework-arduinoadafruitnrf52 @ symlink://C:\VSCode_Projects\Adafruit_nRF52_Arduino
extra_scripts = create-uf2.py
build_flags = ${arduino_base.build_flags}
  -D NRF52_PLATFORM
  -D LFS_NO_ASSERT=1
  -D EXTRAFS=1
lib_deps =
  ${arduino_base.lib_deps}
  https://github.com/oltaco/CustomLFS#0.2.2
  ;adafruit/Adafruit PN532 @ ^1.3.0
  https://github.com/RAKWireless/RAK13600-PN532.git

; ----------------- RP2040 ---------------------

[rp2040_base]
extends = arduino_base
upload_protocol = picotool
board_build.core = earlephilhower
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#4e22a0d ; framework-arduinopico @ 1.50600.0+sha.6a1d13e9
build_flags = ${arduino_base.build_flags}
  -D RP2040_PLATFORM

; ----------------- STM32 ----------------------

[stm32_base]
extends = arduino_base
platform = ststm32
extra_scripts = post:arch/stm32/build_hex.py
build_flags = ${arduino_base.build_flags}
  -D STM32_PLATFORM
  -I src/helpers/stm32
  -I $PROJECT_PACKAGES_DIR/framework-arduinoststm32/libraries/SubGhz/src
build_src_filter = ${arduino_base.build_src_filter}
  +<helpers/stm32>
lib_deps = ${arduino_base.lib_deps}
  file://arch/stm32/Adafruit_LittleFS_stm32
  SubGhz

[sensor_base]
build_flags =
  -D ENV_INCLUDE_GPS=1
  -D ENV_INCLUDE_AHTX0=1
  -D ENV_INCLUDE_BME280=1
  -D ENV_INCLUDE_BMP280=1
  -D ENV_INCLUDE_SHTC3=1
  -D ENV_INCLUDE_SHT4X=1
  -D ENV_INCLUDE_LPS22HB=1
  -D ENV_INCLUDE_INA3221=1
  -D ENV_INCLUDE_INA219=1
  -D ENV_INCLUDE_INA226=1
  -D ENV_INCLUDE_INA260=1
  -D ENV_INCLUDE_MLX90614=1
  -D ENV_INCLUDE_VL53L0X=1
  -D ENV_INCLUDE_BME680=1
  -D ENV_INCLUDE_BMP085=1
lib_deps =
  adafruit/Adafruit INA3221 Library @ ^1.0.1
  adafruit/Adafruit INA219 @ ^1.2.3
  robtillaart/INA226 @ ^0.6.4
  adafruit/Adafruit INA260 Library @ ^1.5.3
  adafruit/Adafruit AHTX0 @ ^2.0.5
  adafruit/Adafruit BME280 Library @ ^2.3.0
  adafruit/Adafruit BMP280 Library @ ^2.6.8
  adafruit/Adafruit SHTC3 Library @ ^1.0.1
  sensirion/Sensirion I2C SHT4x @ ^1.1.2
  arduino-libraries/Arduino_LPS22HB @ ^1.0.2
  adafruit/Adafruit MLX90614 Library @ ^2.1.5
  adafruit/Adafruit_VL53L0X @ ^1.2.4
  stevemarple/MicroNMEA @ ^2.0.6
  adafruit/Adafruit BME680 Library @ ^2.0.4
  adafruit/Adafruit BMP085 Library @ ^1.2.4
  adafruit/Adafruit PN532 @ ^1.3.0

; ----------------- TESTING ---------------------

[env:native]
platform = native
build_flags = -std=c++17
  -I src
  -I test/mocks
test_build_src = yes
build_src_filter =
  -<*>
  +<../src/Utils.cpp>
lib_deps =
  google/googletest @ 1.17.0
